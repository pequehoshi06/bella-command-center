
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>B.E.L.L.A. | Sistema Central</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 25px 18px;
      background: #07130e;
      color: #e5f5eb;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 520px;
      background: #10251b;
      border: 1px solid #28583d;
      border-radius: 22px;
      padding: 25px;
      box-shadow: 0 0 35px #163d2a66;
    }

    .status {
      color: #78e6a4;
      font-size: 12px;
      letter-spacing: 2px;
      margin-bottom: 30px;
    }

    h1 {
      color: #a4edbd;
      font-size: 29px;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #c2d8ca;
      margin-bottom: 28px;
    }

    .clock {
      font-size: 48px;
      font-weight: bold;
      color: #ffffff;
      letter-spacing: 2px;
      margin-top: 25px;
    }

    .date {
      color: #8fcea6;
      margin-top: 8px;
      margin-bottom: 30px;
      text-transform: capitalize;
    }

    .section {
      border-top: 1px solid #28583d;
      padding-top: 22px;
      margin-top: 20px;
    }

    h2 {
      font-size: 15px;
      letter-spacing: 2px;
      color: #8ee5ad;
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin: 15px 0 8px;
      color: #c9e2d1;
      font-size: 14px;
    }

    select, button {
      width: 100%;
      padding: 13px;
      border-radius: 10px;
      border: 1px solid #39734e;
      background: #183b29;
      color: white;
      font-size: 14px;
    }

    input[type="range"] {
      width: 100%;
      accent-color: #75dfa0;
    }

    button {
      margin-top: 12px;
      cursor: pointer;
      background: #24583a;
      border: none;
      font-weight: bold;
    }

    button:active {
      background: #347b50;
    }

    .secondary {
      background: #193527;
      border: 1px solid #39734e;
    }

    #voiceText {
      color: #a4edbd;
      font-size: 14px;
      margin-top: 15px;
      min-height: 20px;
    }

    .footer {
      margin-top: 30px;
      color: #668b73;
      font-size: 11px;
      text-align: center;
      letter-spacing: 1px;
    }
  </style>
</head>

<body>

  <main class="container">

    <div class="status">
      ● B.E.L.L.A. SYSTEM ONLINE
    </div>

    <h1 id="greeting">Hola, Renata.</h1>

    <div class="subtitle" id="greetingMessage">
      Estoy a tu servicio.
    </div>

    <div class="clock" id="clock">--:--:--</div>
    <div class="date" id="date">Cargando fecha...</div>

    <section class="section">
      <h2>VOICE CONTROL 2.0</h2>

      <label for="voiceSelect">Seleccionar voz</label>
      <select id="voiceSelect">
        <option value="">Cargando voces...</option>
      </select>

      <label for="rate">
        Velocidad: <span id="rateValue">1.0</span>
      </label>
      <input
        type="range"
        id="rate"
        min="0.7"
        max="1.3"
        step="0.1"
        value="1"
      >

      <label for="pitch">
        Tono: <span id="pitchValue">1.05</span>
      </label>
      <input
        type="range"
        id="pitch"
        min="0.7"
        max="1.4"
        step="0.05"
        value="1.05"
      >

      <button onclick="testVoice()">Probar mi voz</button>
      <button class="secondary" onclick="listenBella()">
        🎙️ Hablar con B.E.L.L.A.
      </button>
      <button class="secondary" onclick="silenceBella()">
        Silenciar
      </button>

      <div id="voiceText">
        Sistema de reconocimiento preparado.
      </div>
    </section>

    <div class="footer">
      PERSONAL INTELLIGENCE SYSTEM · B.E.L.L.A.
    </div>

  </main>

  <!-- Primero cargamos el motor de voz -->
  <script src="voz.js"></script>

  <script>
    // RELOJ Y SALUDO AUTOMÁTICO

    function updateClock() {
      const now = new Date();

      const time = new Intl.DateTimeFormat("es-CL", {
        timeZone: "America/Santiago",
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
        hour12: false
      }).format(now);

      const date = new Intl.DateTimeFormat("es-CL", {
        timeZone: "America/Santiago",
        weekday: "long",
        day: "numeric",
        month: "long",
        year: "numeric"
      }).format(now);

      document.getElementById("clock").textContent = time;
      document.getElementById("date").textContent = date;

      const hour = Number(
        new Intl.DateTimeFormat("en-US", {
          timeZone: "America/Santiago",
          hour: "numeric",
          hour12: false
        }).format(now)
      );

      let greeting;
      let message;

      if (hour >= 5 && hour < 12) {
        greeting = "Buenos días, Renata.";
        message = "Espero que hayas descansado. Estoy a tu servicio.";
      } else if (hour >= 12 && hour < 20) {
        greeting = "Buenas tardes, Renata.";
        message = "Espero que tu día vaya bien. Estoy a tu servicio.";
      } else {
        greeting = "Buenas noches, Renata.";
        message = "¿Lista para continuar? Estoy a tu servicio.";
      }

      document.getElementById("greeting").textContent = greeting;
      document.getElementById("greetingMessage").textContent = message;
    }

    updateClock();
    setInterval(updateClock, 1000);


    // CONFIGURACIÓN DE VOZ

    const voiceSelect = document.getElementById("voiceSelect");
    const rateSlider = document.getElementById("rate");
    const pitchSlider = document.getElementById("pitch");

    function loadVoiceOptions() {
      if (!window.BELLA_VOICE) return;

      const voices = BELLA_VOICE.getVoices();
      const spanishVoices = voices.filter(v =>
        v.lang.toLowerCase().startsWith("es")
      );

      voiceSelect.innerHTML = "";

      if (spanishVoices.length === 0) {
        voiceSelect.innerHTML =
          '<option value="">Voz predeterminada del dispositivo</option>';
        return;
      }

      spanishVoices.forEach(voice => {
        const option = document.createElement("option");
        option.value = voice.name;
        option.textContent = voice.name + " (" + voice.lang + ")";
        voiceSelect.appendChild(option);
      });

      if (BELLA_VOICE.selectedVoice) {
        voiceSelect.value = BELLA_VOICE.selectedVoice;
      }
    }

    if (window.speechSynthesis) {
      window.speechSynthesis.onvoiceschanged = loadVoiceOptions;
    }

    loadVoiceOptions();

    rateSlider.value = BELLA_VOICE.rate;
    pitchSlider.value = BELLA_VOICE.pitch;

    document.getElementById("rateValue").textContent =
      Number(rateSlider.value).toFixed(1);

    document.getElementById("pitchValue").textContent =
      Number(pitchSlider.value).toFixed(2);

    voiceSelect.addEventListener("change", () => {
      BELLA_VOICE.setVoice(voiceSelect.value);
    });

    rateSlider.addEventListener("input", () => {
      BELLA_VOICE.setRate(rateSlider.value);
      document.getElementById("rateValue").textContent =
        Number(rateSlider.value).toFixed(1);
    });

    pitchSlider.addEventListener("input", () => {
      BELLA_VOICE.setPitch(pitchSlider.value);
      document.getElementById("pitchValue").textContent =
        Number(pitchSlider.value).toFixed(2);
    });

    function testVoice() {
      BELLA_VOICE.speak(
        "Hola, Renata. Soy B.E.L.L.A. Tu sistema personal está operativo. ¿Qué necesitas hoy?"
      );
    }

    function listenBella() {
      BELLA_VOICE.listen(message => {
        document.getElementById("voiceText").textContent =
          "Te escuché: " + message;
      });
    }

    function silenceBella() {
      BELLA_VOICE.silence();
      BELLA_VOICE.stop();
      document.getElementById("voiceText").textContent =
        "Sistema en silencio.";
    }
  </script>

</body>
</html>
